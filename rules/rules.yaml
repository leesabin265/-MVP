# 탐지 룰 — 모든 pattern은 정규화된 텍스트(URL·엔티티 디코딩, NFKC, 소문자, 주석 제거, 공백 1칸)에 적용된다.
# RE2 문법만 허용(역참조·lookaround 불가). keywords는 Aho-Corasick 프리필터용 소문자 부분 문자열.
# kind: regex(기본) | analyzer(토큰 분석) | signal(정규화 단계에서 나온 우회 신호)
version: 1
threshold: 6

# 경로(·파라미터)별 차단 임계값. 탐지 임계값은 전역 threshold 그대로라 사이 점수는 DETECT_ONLY로 기록된다.
# 근거: docs/report.md 4장 "경로별 차단 임계값" — 8이면 기술 Q&A 차단 오탐 4/40 → 0/40, 탐지율 100% 유지.
path_thresholds:
  - path: /api/qna/posts
    param: content
    threshold: 8
    reason: 기술 Q&A 게시판 본문 오탐 완화 (임계값 스윕 근거, docs/report.md 4장)

# 경로별 룰 모드(경로별 룰 그룹). 가장 구체적인 설정 하나만 적용된다.
rule_overrides:
  - path: /api/qna/posts
    param: content
    rule_id: XSS-004
    mode: BLOCK
    reason: 임계값 8로 올린 게시판 본문에서 외부 리소스 태그(embed·base·link)가 기록만 되던 것을 다시 차단 (docs/report.md 4장)

rules:
  # ───────────── SQL Injection ─────────────
  - id: SQLI-001
    category: SQLI
    description: 따옴표 탈출 후 항상 참(tautology) 조건
    keywords: ["or", "and", "||", "&&"]
    pattern: '[''"`]\s*\)*\s*(or|and|xor|\|\||&&)\s*\(?\s*(([''"`][\w.]*[''"`]|[\w.]+)\s*((=|<>|!=|<=>|<|>)\s*[''"`]?[\w.]*|(like|r?like|regexp)\s*[''"`%]|is\s+(not\s+)?null\b)|true\b|false\b|not\b|\d+\s*(--|#|;|$))'
    weight: 6
    mode: BLOCK
  - id: SQLI-002
    category: SQLI
    description: UNION 기반 결과 결합
    keywords: ["union"]
    pattern: 'union(\s+(all|distinct))?\s*\(?\s*select\b'
    weight: 7
    mode: BLOCK
  - id: SQLI-003
    category: SQLI
    description: 따옴표·괄호 뒤 또는 입력 끝의 SQL 주석 종결자
    keywords: ["--", "#"]
    pattern: '([''"`)]\s*(--|#)|--\s*$)'
    weight: 2
    mode: BLOCK
  - id: SQLI-004
    category: SQLI
    description: 세미콜론 뒤 다중 쿼리(stacked queries)
    keywords: [";"]
    pattern: ';\s*((drop|truncate|alter|create)\s+(table|database|schema|user|procedure|function)\b|delete\s+from\b|insert\s+into\b|update\s+\w+\s+set\b|exec(ute)?\s+(xp_|sp_|master\.|\w+\s*@)|shutdown\b|declare\s+@)'
    weight: 6
    mode: BLOCK
  - id: SQLI-005
    category: SQLI
    description: 시간 지연 함수(블라인드 SQLi)
    keywords: ["sleep", "benchmark", "waitfor"]
    pattern: '(^|[^\w.])(sleep|pg_sleep|benchmark)\s*\(\s*\d|waitfor\s+delay\s*[''"]'
    weight: 4
    mode: BLOCK
  - id: SQLI-006
    category: SQLI
    description: 시스템 카탈로그·메타데이터 테이블 접근
    keywords: ["information_schema", "sysobjects", "syscolumns", "pg_catalog", "sqlite_master", "mysql.user", "all_tables", "pg_shadow"]
    pattern: 'information_schema|sysobjects|syscolumns|pg_catalog|sqlite_master|mysql\.user|all_tables|pg_shadow'
    weight: 5
    mode: BLOCK
  - id: SQLI-007
    category: SQLI
    description: SELECT … FROM 구문
    keywords: ["select"]
    pattern: '\bselect\s+(distinct\s+|top\s+\d+\s+)?[\w*@.,()\s''"`]{1,120}?\s+from\s+[\w.`"\[]'
    weight: 4
    mode: BLOCK
  - id: SQLI-008
    category: SQLI
    description: 논리 연산자 뒤 SQL 함수 호출(블라인드·에러 기반)
    keywords: ["or", "and"]
    pattern: '\b(or|and|xor)\s+\(?\s*(sleep|pg_sleep|benchmark|extractvalue|updatexml|ascii|substring|substr|mid|length|if|case|exists|char|ord|hex|database|version|user|current_user|rand)\s*\('
    weight: 4
    mode: BLOCK
  - id: SQLI-009
    category: SQLI
    description: 파일·명령 실행 및 에러 유도 함수
    keywords: ["load_file", "outfile", "dumpfile", "xp_cmdshell", "sp_executesql", "utl_http", "dbms_pipe", "extractvalue", "updatexml", "group_concat", "char("]
    pattern: 'load_file\s*\(|into\s+(out|dump)file\b|xp_cmdshell|sp_executesql|utl_http|dbms_pipe|extractvalue\s*\(|updatexml\s*\(|group_concat\s*\(|char\s*\(\s*\d+\s*(,\s*\d+\s*){2,}\)'
    weight: 5
    mode: BLOCK
  - id: SQLI-010
    category: SQLI
    kind: analyzer
    analyzer: sqli_quote_break
    description: 토큰 분석 — 따옴표 종료 직후 SQL 키워드·주석·세미콜론
    keywords: ["'", '"']
    weight: 4
    mode: BLOCK
  - id: SQLI-011
    category: SQLI
    description: 따옴표 없는 문맥의 상수 비교 tautology (id=1 or 1=1, 1 or 'a'='a')
    keywords: ["or", "and"]
    pattern: '(^|[\w)])\s+(or|and|xor)\s+\(?\s*(\d+\s*(=|<>|!=|<|>)\s*\d+\b|''[^'']{0,20}''\s*(=|<>|!=)\s*''[^'']{0,20}''|"[^"]{0,20}"\s*(=|<>|!=)\s*"[^"]{0,20}")'
    weight: 6
    mode: BLOCK
  - id: SQLI-012
    category: SQLI
    description: 컬럼 수 탐색(order by n / group by n)
    keywords: ["order by", "group by"]
    pattern: '\b(order|group)\s+by\s+\d+\s*(--|#|;|\)|$)'
    weight: 2
    mode: BLOCK
  - id: SQLI-013
    category: SQLI
    description: 긴 16진 리터럴(문자열 우회)
    keywords: ["0x"]
    pattern: '\b0x[0-9a-f]{8,}\b'
    weight: 2
    mode: BLOCK
  - id: SQLI-014
    category: SQLI
    description: 문자열 연결·형변환을 이용한 우회
    keywords: ["concat", "cast(", "convert("]
    pattern: '(concat(_ws)?|cast|convert)\s*\([^)]{0,80}(select|0x[0-9a-f]+|char\s*\(|@@)'
    weight: 4
    mode: BLOCK
  - id: SQLI-015
    category: SQLI
    description: DB 환경 변수·버전 조회
    keywords: ["@@"]
    pattern: '@@(version|datadir|hostname|basedir|servername|tmpdir)\b'
    weight: 4
    mode: BLOCK
  - id: SQLI-016
    category: SQLI
    description: 논리 연산자 뒤 16진 리터럴(참 값 위장)
    keywords: ["0x"]
    pattern: '\b(and|or|xor)\s+\(?\s*0x[0-9a-f]{2,}'
    weight: 4
    mode: BLOCK
  - id: SQLI-017
    category: SQLI
    description: 괄호 서브쿼리 (select …)
    keywords: ["select"]
    pattern: '\(\s*select\s+[\w@*(''"]'
    weight: 3
    mode: BLOCK
  - id: SQLI-018
    category: SQLI
    description: CASE WHEN 조건 분기(블라인드 SQLi)
    keywords: ["case"]
    pattern: '\bcase\s+when\b.{0,80}?\bthen\b'
    weight: 3
    mode: BLOCK

  # ───────────── XSS ─────────────
  - id: XSS-001
    category: XSS
    description: script 태그
    keywords: ["script"]
    pattern: '<\s*/?\s*script\b'
    weight: 7
    mode: BLOCK
  - id: XSS-002
    category: XSS
    description: 태그 안 이벤트 핸들러 속성
    keywords: ["on"]
    pattern: '<[a-z][a-z0-9-]*\b[^>]*[\s/"''`]on[a-z]{3,}\s*='
    weight: 6
    mode: BLOCK
  - id: XSS-003
    category: XSS
    description: javascript/vbscript URI (스킴 안 탭·개행 포함 — 브라우저는 무시한다)
    keywords: ["javascript", "vbscript", "livescript", "href", "src", "action"]
    pattern: '(href|src|action|formaction|data|xlink:href|background|poster)\s*=\s*[''"`]?\s*(j\s*a\s*v\s*a|v\s*b|l\s*i\s*v\s*e)\s*s\s*c\s*r\s*i\s*p\s*t\s*:'
    weight: 6
    mode: BLOCK
  - id: XSS-004
    category: XSS
    description: 외부 리소스·활성 콘텐츠 태그
    keywords: ["<"]
    pattern: '<\s*(iframe|object|embed|svg|math|base|link|meta|frame|frameset|applet|form|isindex)\b'
    weight: 4
    mode: DETECT
  - id: XSS-005
    category: XSS
    description: 위험한 DOM 싱크·동적 코드 실행
    keywords: ["document.", "window.", "innerhtml", "outerhtml", "eval", "settimeout", "setinterval", "function", "fromcharcode", "atob"]
    pattern: 'document\.(cookie|write|domain|location)|window\.(location|name)|\.(inner|outer)html\s*=|\beval\s*\(|set(timeout|interval)\s*\(\s*[''"`]|new\s+function\s*\(|fromcharcode|\batob\s*\('
    weight: 4
    mode: BLOCK
  - id: XSS-006
    category: XSS
    description: alert/prompt/confirm 호출(PoC 페이로드)
    keywords: ["alert", "prompt", "confirm", "print"]
    pattern: '\b(alert|prompt|confirm|print)\s*(\(|`)'
    weight: 3
    mode: BLOCK
  - id: XSS-007
    category: XSS
    description: data URI(HTML·JS)·srcdoc
    keywords: ["data:", "srcdoc"]
    pattern: 'data\s*:\s*(text/html|application/(x-)?javascript)|srcdoc\s*='
    weight: 6
    mode: BLOCK
  - id: XSS-008
    category: XSS
    description: CSS 기반 스크립트 실행
    keywords: ["expression", "-moz-binding", "behavior"]
    pattern: 'expression\s*\(|-moz-binding\s*:|behavior\s*:\s*url'
    weight: 5
    mode: BLOCK
  - id: XSS-009
    category: XSS
    description: 속성값 탈출 후 새 태그 시작
    keywords: [">"]
    pattern: '[''"`]\s*/?>\s*<\s*/?[a-z]'
    weight: 2
    mode: BLOCK
  - id: XSS-010
    category: XSS
    description: 실행 가능 미디어·폼 태그
    keywords: ["<"]
    pattern: '<\s*(img|video|audio|source|input|details|body|marquee|select|textarea|keygen|style|image|xss)\b'
    weight: 2
    mode: BLOCK
  - id: XSS-011
    category: XSS
    description: 클라이언트 템플릿 인젝션(AngularJS 샌드박스 탈출)
    keywords: ["{{"]
    pattern: '\{\{[^}]{0,200}(constructor|\$eval|\$on|__proto__)'
    weight: 5
    mode: BLOCK
  - id: XSS-012
    category: XSS
    description: 속성 탈출 후 이벤트 핸들러 주입(태그 없이)
    keywords: ["on"]
    pattern: '[''"`]\s*/?[\w\s-]{0,40}?(^|[\s/])on[a-z]{4,}\s*=\s*[''"`]?\s*[a-z_$]'
    weight: 6
    mode: BLOCK
  - id: XSS-014
    category: XSS
    description: 속성 밖 javascript/vbscript URI 뒤 함수 호출
    keywords: ["javascript", "vbscript"]
    pattern: '(javascript|vbscript)\s*:\s*[a-z_$][\w$.]*\s*[(`]'
    weight: 4
    mode: BLOCK
  - id: XSS-013
    category: XSS
    description: 리소스 로드 가로채기(base href, link rel=import, meta refresh)
    keywords: ["base", "link", "meta"]
    pattern: '<\s*base\b[^>]*\bhref\s*=|<\s*link\b[^>]*\brel\s*=\s*[''"]?\s*import|<\s*meta\b[^>]*http-equiv\s*=\s*[''"]?\s*refresh[^>]*url\s*='
    weight: 6
    mode: BLOCK
  - id: XSS-016
    category: XSS
    description: SVG data URI (스크립트를 품을 수 있음, CSS 배경 용도와 겹쳐 약한 신호)
    keywords: ["svg+xml"]
    pattern: 'data\s*:\s*image/svg\+xml'
    weight: 4
    mode: BLOCK
  - id: XSS-015
    category: XSS
    description: JS 문자열 탈출 후 연산자·함수 호출 ('-alert(1)-')
    keywords: ["'", '"', "`"]
    pattern: '[''"`]\s*[-+*/%^|&;,]\s*[a-z_$][\w$.]*\s*[(`]'
    weight: 4
    mode: BLOCK

  # ───────────── 악성 스크립트 ─────────────
  - id: SCR-001
    category: SCR
    description: PHP 코드 태그
    keywords: ["<?"]
    pattern: '<\?(php\b|=)'
    weight: 4
    mode: BLOCK
  - id: SCR-002
    category: SCR
    description: PHP 명령 실행 함수 + 사용자 입력
    keywords: ["system", "exec", "passthru", "popen", "proc_open", "assert", "eval"]
    pattern: '\b(system|exec|shell_exec|passthru|popen|proc_open|assert|eval)\s*\(\s*\$_(get|post|request|cookie|server)'
    weight: 7
    mode: BLOCK
  - id: SCR-003
    category: SCR
    kind: signal
    signal: js_escape
    description: 난독화된 JS 문자열(\\x·\\u 이스케이프 4개 이상) — 정규화에서 디코딩 후 다른 룰이 본다
    weight: 3
    mode: BLOCK
  - id: SCR-004
    category: SCR
    description: 서버 측 명령 실행(Node.js·Java)
    keywords: ["child_process", "mainmodule", "getruntime", "java.lang.runtime", "processbuilder"]
    pattern: 'require\s*\(\s*[''"`]child_process|process\.mainmodule|runtime\.getruntime\s*\(\s*\)\s*\.exec|java\.lang\.runtime|new\s+java\.lang\.processbuilder'
    weight: 7
    mode: BLOCK
  - id: SCR-005
    category: SCR
    description: JNDI 룩업(Log4Shell, CVE-2021-44228)
    keywords: ["jndi", "${"]
    pattern: '\$\{\s*jndi\s*:|\$\{[^}]{0,40}\$\{[^}]{0,40}\}[^}]{0,40}(ndi|ldap|rmi|dns)'
    weight: 8
    mode: BLOCK
  - id: SCR-006
    category: SCR
    description: 쿠키·스토리지 외부 유출
    keywords: ["cookie", "localstorage"]
    pattern: '(document\.cookie|localstorage)[^;]{0,80}(fetch|xmlhttprequest|new\s+image|\.src\s*=|sendbeacon|location)|(fetch|sendbeacon|new\s+image|location(\.href)?\s*=)[^;]{0,80}(document\.cookie|localstorage)'
    weight: 6
    mode: BLOCK
  - id: SCR-007
    category: SCR
    description: 서버 측 템플릿 인젝션(SSTI) 산술 프로브
    keywords: ["{{", "${", "#{"]
    pattern: '\{\{\s*\d+\s*\*\s*\d+\s*\}\}|\$\{\s*\d+\s*\*\s*\d+\s*\}|#\{\s*\d+\s*\*\s*\d+\s*\}'
    weight: 6
    mode: BLOCK
  - id: SCR-008
    category: SCR
    description: 인코딩된 페이로드를 eval
    keywords: ["eval", "assert"]
    pattern: '(eval|assert)\s*\(\s*(base64_decode|gzinflate|gzuncompress|str_rot13|atob|unescape|decodeuricomponent)\s*\('
    weight: 7
    mode: BLOCK

  - id: SCR-009
    category: SCR
    description: Python 객체 그래프 탐색(SSTI 샌드박스 탈출) — dunder 속성 체인
    keywords: ["__"]
    pattern: '__(class|mro|base|bases|subclasses|globals|init|builtins)__\W{1,4}(\w+\W{1,4}){0,3}__(class|mro|base|bases|subclasses|globals|init|builtins|import)__'
    weight: 6
    mode: BLOCK

  # ───────────── OS 명령어 삽입 ─────────────
  # 단독으로 차단 기준(6)에 닿는 것은 '구분자 + 명령', '명령 치환', '역방향 셸' 처럼 셸 문법이 성립한 경우뿐이다.
  # 기술 게시판에 흔한 'ls -al', 'sleep 5 && echo done' 은 게시판 경로 임계값(8)에서 기록만 된다.
  - id: CMD-001
    category: CMD
    description: 셸 구분자(; | & `) 뒤 시스템 명령
    keywords: [";", "|", "&", "`"]
    pattern: '[;&|`]\s*(sudo\s+)?(cat|ls|id|whoami|uname|pwd|wget|curl|nc|ncat|netcat|bash|sh|zsh|dash|python[23]?|perl|ruby|php|ping|nslookup|dig|sleep|rm|chmod|chown|echo|touch|base64|ifconfig|env|printenv|telnet|tftp|xterm)(\s|$|[;&|`<>$])'
    weight: 6
    mode: BLOCK
  - id: CMD-002
    category: CMD
    description: 명령 치환 $(…)·`…` 안의 시스템 명령
    keywords: ["$(", "`"]
    pattern: '(\$\(|`)\s*(sudo\s+)?(cat|ls|id|whoami|uname|pwd|wget|curl|nc|ncat|bash|sh|python[23]?|perl|ping|nslookup|dig|sleep|rm|echo|base64|env|printenv)\b'
    weight: 6
    mode: BLOCK
  - id: CMD-003
    category: CMD
    description: 역방향 셸·내려받아 바로 실행
    keywords: ["/dev/tcp", "/dev/udp", "nc", "bash", "mkfifo", "curl", "wget", "socat"]
    pattern: '/dev/(tcp|udp)/|\bn(c|cat)\s+(-\w+\s+)*-[a-z]*[ec]\b|\bbash\s+-i\s*[<>]|\bmkfifo\b|\bsocat\b.{0,40}exec|\b(curl|wget)\b[^;&|]{0,200}\|\s*(sudo\s+)?(ba|z|da)?sh\b'
    weight: 7
    mode: BLOCK
  - id: CMD-004
    category: CMD
    description: 공백 우회용 셸 변수($IFS)
    keywords: ["ifs"]
    pattern: '\$\{?ifs\}?'
    weight: 5
    mode: BLOCK
  - id: CMD-005
    category: CMD
    description: 구분자 뒤 Windows 명령(cmd·PowerShell)
    keywords: [";", "|", "&"]
    pattern: '[;&|]\s*(type\s+[a-z]:|dir\s+[a-z]:|net\s+(user|localgroup|share)\b|powershell|pwsh|cmd(\.exe)?\s*/[ck]\b|certutil|systeminfo|tasklist|ipconfig|whoami\.exe|bitsadmin|wmic)'
    weight: 6
    mode: BLOCK
  - id: CMD-006
    category: CMD
    kind: signal
    signal: newline_command
    description: 개행(%0a) 뒤 시스템 명령 — 셸에서는 개행이 구분자
    weight: 6
    mode: BLOCK

  # ───────────── 경로 조작·파일 포함 ─────────────
  # 경로 문자열 하나만으로는 차단하지 않는다('../../components'·'/etc/nginx' 는 정상 글에 흔하다).
  # 탈출 시퀀스 + 민감 파일, 값 전체가 민감 파일 경로, 위험한 스트림 래퍼일 때 차단 기준에 닿는다.
  - id: PATH-001
    category: PATH
    description: 상위 디렉터리 탈출 2단계 이상(../, ..\, ....//, 오버롱 UTF-8 %c0%af)
    keywords: [".."]
    pattern: '(\.{2,4}([/\\]+|\x{fffd}+)){2,}'
    weight: 4
    mode: BLOCK
  - id: PATH-002
    category: PATH
    description: 민감 시스템·설정 파일
    keywords: ["passwd", "shadow", "etc/", "etc\\", "proc/", "win.ini", "boot.ini", "system32", ".ssh", "web-inf", ".htaccess", ".htpasswd", ".env", "var/log"]
    pattern: 'etc[/\\]+(passwd|shadow|group|hosts|issue|crontab|sudoers)\b|proc[/\\]+self[/\\]+(environ|cmdline|fd|maps|status)|win(dows)?[/\\]+(win\.ini|system\.ini)|boot\.ini|system32[/\\]+(drivers[/\\]+etc|config[/\\]+sam)|\.ssh[/\\]+(id_rsa|id_ed25519|authorized_keys)|web-inf[/\\]+web\.xml|\.ht(access|passwd)\b|(^|[/\\])\.env(\s|$)|var[/\\]+log[/\\]'
    weight: 4
    mode: BLOCK
  - id: PATH-003
    category: PATH
    description: 값 전체가 시스템 디렉터리 절대 경로·드라이브 경로·상위 경로로 시작(파일 이름 파라미터 조작)
    keywords: ["/", "\\", ":"]
    # '/api/v1/' 같은 URL 경로에는 걸리지 않게 시스템 최상위 디렉터리만 본다.
    pattern: '^\s*([a-z]:[/\\]|[/\\]+(etc|proc|sys|dev|var|usr|root|home|boot|tmp|opt|srv|windows|winnt|inetpub|program files)[/\\]|\.{2,4}([/\\]|\x{fffd}))'
    weight: 2
    mode: BLOCK
  - id: PATH-004
    category: PATH
    description: 파일 포함용 스트림 래퍼(php://filter, phar://, zip://, expect:// 등)
    keywords: ["://"]
    pattern: '\b(php|phar|zip|expect|glob|compress\.(zlib|bzip2)|ogg|rar|ssh2(\.\w+)?)://'
    weight: 6
    mode: BLOCK
  - id: PATH-005
    category: PATH
    description: file:// 로 로컬 파일 지정
    keywords: ["file:"]
    pattern: '\bfile:/{2,3}'
    weight: 3
    mode: BLOCK

  # ───────────── 업로드 파일 ─────────────
  # 파일 이름·Content-Type 이 아니라 실제 바이트(매직 넘버)를 기준으로 본다(src/mpg/gateway/uploads.py).
  # 텍스트 파일 내용은 '이름#content' 필드로 다른 룰(XSS·SCR·CMD)이 검사한다.
  - id: FILE-001
    category: FILE
    kind: signal
    signal: upload_script_ext
    description: 서버에서 실행되는 확장자 업로드(.php .jsp .aspx .cgi .shtml .htaccess 등)
    weight: 6
    mode: BLOCK
  - id: FILE-002
    category: FILE
    kind: signal
    signal: upload_double_ext
    description: 이중 확장자에 실행 확장자를 숨김(shell.php.jpg)
    weight: 6
    mode: BLOCK
  - id: FILE-003
    category: FILE
    kind: signal
    signal: upload_type_mismatch
    description: 이미지·문서라고 선언했지만 실제 내용은 HTML·스크립트·실행 파일
    weight: 6
    mode: BLOCK
  - id: FILE-004
    category: FILE
    kind: signal
    signal: upload_embedded_code
    description: 이미지·PDF 등 바이너리 안에 서버·브라우저 코드(<?php, <script, <%) — 폴리글롯 웹셸
    weight: 6
    mode: BLOCK
  - id: FILE-005
    category: FILE
    kind: signal
    signal: upload_executable
    description: 실행 파일(ELF·PE·Mach-O) 업로드 — 기본은 기록만, 업로드 경로별로 차단 설정
    weight: 4
    mode: DETECT

  # ───────────── 응답 검사(정보 유출) ─────────────
  # 백엔드 응답 본문(텍스트, 최대 256 KB)에만 쓴다. 파라미터 이름은 '$response' 라서 경로별 임계값·룰 모드·예외를
  # 요청과 같은 방식으로 걸 수 있다. 룰이 하나라도 걸리면 기록하고, 차단 점수 ≥ 임계값이면 응답을 502로 바꾼다.
  # DB 오류·스택 트레이스는 5xx 응답일 때만 차단 점수가 넘는다(게시판 글 속 오류 문구 인용은 200 응답이라 기록만).
  - id: RESP-001
    category: RESP
    description: DB 오류 메시지 노출(에러 기반 SQL 인젝션의 신호)
    keywords: ["sql", "mysql", "ora-", "pg::", "psql", "sqlite", "odbc", "quotation mark", "syntax error at or near"]
    pattern: 'you have an error in your sql syntax|warning:\s+(mysqli?|pg|oci|sqlite)_|unclosed quotation mark after the character string|quoted string not properly terminated|pg::syntaxerror|org\.postgresql\.util\.psqlexception|syntax error at or near "|sqlite3?\.operationalerror|sqlstate\[\w+\]|\bora-\d{5}\b|microsoft ole db provider for (sql server|odbc)|java\.sql\.sqlexception|com\.mysql\.jdbc'
    weight: 4
    mode: BLOCK
  - id: RESP-002
    category: RESP
    description: 스택 트레이스·디버그 정보 노출
    keywords: ["traceback", "exception", "stack trace", "on line", ".java:", "line "]
    pattern: 'traceback \(most recent call last\)|exception in thread "|\n\s+at [\w$.<>]+\([\w]+\.java:\d+\)|stack trace:|(fatal error|parse error|warning): .{1,200} in /.{1,200} on line \d+|\bat .{1,200} in .{1,200}:line \d+|werkzeug debugger|django\.core\.exceptions|whitelabel error page'
    weight: 4
    mode: BLOCK
  - id: RESP-003
    category: RESP
    description: /etc/passwd 내용 노출(경로 조작 성공)
    keywords: ["root:"]
    pattern: 'root:[x*!]?:0:0:'
    weight: 8
    mode: BLOCK
  - id: RESP-004
    category: RESP
    description: 개인 키 노출
    keywords: ["private key"]
    pattern: '-----begin (rsa |ec |dsa |openssh |encrypted |pgp )?private key( block)?-----'
    weight: 8
    mode: BLOCK
  - id: RESP-005
    category: RESP
    description: 클라우드 액세스 키 노출(AWS·GCP 서비스 계정)
    keywords: ["akia", "asia", "private_key_id"]
    pattern: '\b(akia|asia)[0-9a-z]{16}\b|"private_key_id"\s*:\s*"[0-9a-f]{40}"'
    weight: 6
    mode: BLOCK
  - id: RESP-006
    category: RESP
    description: 디렉터리 목록 노출
    keywords: ["index of /"]
    pattern: '<title>\s*index of /|<h1>\s*index of /'
    weight: 4
    mode: DETECT
  - id: RESP-007
    category: RESP
    kind: signal
    signal: response_5xx
    description: 5xx 오류 응답(다른 RESP 룰과 함께일 때만 점수에 들어감)
    weight: 2
    mode: BLOCK

  # ───────────── 우회 신호(정규화 단계) ─────────────
  - id: ENC-001
    category: ENC
    kind: signal
    signal: excessive_encoding
    description: URL 디코딩 3회 후에도 인코딩이 남음
    weight: 6
    mode: BLOCK
  - id: ENC-002
    category: ENC
    kind: signal
    signal: multi_encoding
    description: 다중 URL 인코딩(2회 이상 디코딩)
    weight: 2
    mode: BLOCK
  - id: ENC-003
    category: ENC
    kind: signal
    signal: fullwidth
    description: 전각·호환 문자로 특수문자 위장(NFKC 후 생성)
    weight: 2
    mode: BLOCK
  - id: ENC-004
    category: ENC
    kind: signal
    signal: comment_obfuscation
    description: 키워드 사이 인라인 주석·MySQL 버전 주석
    weight: 2
    mode: BLOCK
  - id: ENC-005
    category: ENC
    kind: signal
    signal: control_char
    description: 널 바이트·제어 문자
    weight: 2
    mode: BLOCK
  - id: ENC-006
    category: ENC
    kind: signal
    signal: html_entity
    description: HTML 엔티티로 특수문자 위장
    weight: 1
    mode: BLOCK
  - id: ENC-007
    category: ENC
    kind: signal
    signal: mixed_case
    description: 키워드 대소문자 혼용
    weight: 1
    mode: BLOCK
  - id: ENC-008
    category: ENC
    kind: signal
    signal: duplicate_param
    description: 같은 파라미터 중복(HTTP Parameter Pollution)
    weight: 1
    mode: BLOCK
