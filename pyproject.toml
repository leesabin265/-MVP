[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mpg"
version = "0.1.0"
description = "Malicious Pattern Gateway — SQLi/XSS/악성 스크립트 차단 API 게이트웨이"
requires-python = ">=3.13"
dependencies = [
  "google-re2>=1.1",
  "pyahocorasick>=2.3.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.28",
  "redis>=5.0",
  "asyncpg>=0.29",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.20",
  "segno>=1.6",  # 수업 참여 페이지 QR 코드
]

dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mpg-regress = "mpg.detection.regress:main"
mpgctl = "mpg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mpg.admin" = ["schema.sql"]
"mpg.classroom" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
