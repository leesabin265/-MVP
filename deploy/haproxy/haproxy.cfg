# 게이트웨이 여러 대 앞단의 로드밸런서.
#  - 외부 TLS(443)를 여기서 끝내고, 게이트웨이로는 내부 CA 인증서를 검증하는 TLS로 다시 연결한다(내부망 TLS).
#  - 게이트웨이 복제본은 Docker DNS(gateway)로 찾는다. 늘리거나 줄이면 5초 안에 반영된다.
#  - 클라이언트가 보낸 X-Forwarded-For는 버리고 실제 접속 주소만 넣는다(게이트웨이는 이 LB만 신뢰한다).
global
    log stdout format raw local0 info
    maxconn 20000
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 3s
    timeout client 30s
    timeout server 35s
    timeout http-request 10s
    timeout check 3s
    retries 2
    option redispatch

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s
    hold obsolete 10s

frontend public
    bind :8443 ssl crt /run/secrets/tls_pem alpn http/1.1
    http-request del-header X-Forwarded-For
    http-request del-header X-Real-IP
    option forwardfor
    http-response set-header Strict-Transport-Security "max-age=31536000"
    default_backend gateways

backend gateways
    balance roundrobin
    option httpchk GET /__mpg/health
    http-check expect status 200
    default-server ssl verify required ca-file /run/secrets/internal_ca sni str(gateway) verifyhost gateway check inter 3s fall 2 rise 2 resolvers docker init-addr none
    server-template gw 8 gateway:8443

frontend health
    bind :8081
    monitor-uri /healthz
